<div class="card h-100 border-0 shadow-sm rounded-3 overflow-hidden">
  <img 
  [src]="producto.imagen"
  class="card-img-top object-fit-contain p-2" 
  [alt]="producto.nombre"
  style="height: 220px; background-color: #f8f9fa;">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ producto.nombre }}</h5>
    <p class="text-muted mb-1">{{ producto.consola }}</p>
    <p class="card-text">{{ producto.descripcion }}</p>
    <p class="fw-bold mt-auto">${{ producto.precio }}</p>
    <button class="btn btn-favorito w-100 mt-3" (click)="onFavorito()">
      ♥ Agregar a favoritos
    </button>
  </div>
</div>
